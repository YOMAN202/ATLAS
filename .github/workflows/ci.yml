name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend — lint + test
    runs-on: ubuntu-latest
    # DB-dependent tests (Phase 1: constraint + migration tests) need a
    # real MySQL 8 to run against — per TDD §12 / Master Prompt §11,
    # "ETL and API tests run against a containerized MySQL instance spun
    # up in the CI job."
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: changeme_root
          MYSQL_DATABASE: atlas_oltp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pchangeme_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL_OLTP: mysql+pymysql://root:changeme_root@127.0.0.1:3306/atlas_oltp_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Migration up/down/up smoke test
        env:
          DATABASE_URL_OLTP: mysql+pymysql://root:changeme_root@127.0.0.1:3306/atlas_oltp_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Test (pytest)
        run: pytest

  simulation:
    name: Simulation — lint + test
    runs-on: ubuntu-latest
    # Simulation shares the OLTP schema with the backend (Decision 1:
    # single source of truth) — same containerized MySQL pattern as the
    # backend job, migrated via backend's own Alembic chain.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: changeme_root
          MYSQL_DATABASE: atlas_oltp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pchangeme_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: simulation
    env:
      TEST_DATABASE_URL_OLTP: mysql+pymysql://root:changeme_root@127.0.0.1:3306/atlas_oltp_test
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # requirements.txt's first line (-e ../backend) is what makes
        # backend's domain services importable here.
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Apply backend migrations (shared OLTP schema)
        working-directory: backend
        env:
          DATABASE_URL_OLTP: mysql+pymysql://root:changeme_root@127.0.0.1:3306/atlas_oltp_test
        run: alembic upgrade head

      - name: Test (pytest)
        run: pytest

  warehouse_ddl:
    name: Warehouse DDL — lint + test
    runs-on: ubuntu-latest
    # Phase 4: no Alembic chain for atlas_olap (raw DDL, see
    # etl/warehouse_ddl/README.md) — same containerized MySQL pattern as
    # the other jobs, but its own dedicated schema. Phase 5 Stage A's
    # tests (etl/tests/) additionally need a real atlas_oltp_test — the
    # MySQL service's MYSQL_DATABASE only creates one schema, so the
    # second is created explicitly in a setup step below.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: changeme_root
          MYSQL_DATABASE: atlas_olap_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pchangeme_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: etl
    env:
      TEST_DATABASE_URL_OLAP: mysql+pymysql://root:changeme_root@127.0.0.1:3306/atlas_olap_test
      TEST_DATABASE_URL_OLTP: mysql+pymysql://root:changeme_root@127.0.0.1:3306/atlas_oltp_test
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # requirements.txt's first line (-e ../backend) is what makes
        # app.core.config.settings and app.models importable here, and
        # transitively installs backend's own requirements.txt (incl.
        # alembic — etl/tests/conftest.py runs backend's real migration
        # chain against atlas_oltp_test).
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Create atlas_oltp_test database
        run: mysql -h 127.0.0.1 -uroot -pchangeme_root -e "CREATE DATABASE IF NOT EXISTS atlas_oltp_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: DDL apply/teardown/apply smoke test
        run: |
          python warehouse_ddl/apply_ddl.py
          python warehouse_ddl/teardown_ddl.py
          python warehouse_ddl/apply_ddl.py

      - name: Test (pytest)
        run: pytest

  frontend:
    name: Frontend — lint + format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check
