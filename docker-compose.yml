services:
  mysql:
    image: mysql:8.0
    container_name: atlas_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-atlas_root_dev}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD:-atlas_root_dev}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: atlas_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # Read-only: backend/tests/api/ builds the OLAP test schema the same
      # way etl/tests/ does, so dashboard-endpoint tests run against a
      # real (if minimal, hand-seeded) warehouse rather than mocks.
      - ./etl/warehouse_ddl:/etl/warehouse_ddl:ro

  simulation:
    build:
      context: .
      dockerfile: simulation/Dockerfile
    container_name: atlas_simulation
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./simulation:/app/simulation
      - ./backend:/backend

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: atlas_frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mysql_data:
