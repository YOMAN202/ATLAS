[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# No --reload in production: the Dockerfile's default CMD is dev-mode
# (file-watching autoreload for `docker compose up` locally); Railway
# runs this override instead. Config lives here rather than editing the
# Dockerfile's CMD, so local `docker compose up` is unaffected.
startCommand = "sh -c \"uvicorn app.main:app --host 0.0.0.0 --port $PORT\""
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
